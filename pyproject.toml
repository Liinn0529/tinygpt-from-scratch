[project]
name = "tinygpt-from-scratch"
version = "0.1.0"
description = "A single-machine language model trained from scratch for learning and research."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "einops>=0.8",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
